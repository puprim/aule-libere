<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3dbb7c"/>
      <stop offset="1" stop-color="#16603c"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="fascio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd76e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="anta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeee5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="translate(-28 0)">
  <!-- fascio di luce sul pavimento -->
  <polygon points="196,388 316,388 392,470 120,470" fill="url(#fascio)"/>
  <!-- vano della porta illuminato -->
  <rect x="180" y="104" width="152" height="292" rx="14" fill="#ffffff"/>
  <rect x="196" y="120" width="120" height="268" rx="4" fill="url(#luce)"/>
  <!-- anta aperta verso l'esterno -->
  <polygon points="316,120 390,92 390,424 316,388" fill="url(#anta)"/>
  <circle cx="374" cy="262" r="9" fill="#16603c"/>
  <!-- linea di terra -->
  <rect x="140" y="386" width="232" height="10" rx="5" fill="#ffffff" opacity=".9"/>
  </g>
</svg>
